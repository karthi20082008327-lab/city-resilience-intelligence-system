version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ucrip_postgres
    environment:
      POSTGRES_USER: ucrip
      POSTGRES_PASSWORD: ucrip_secret_2024
      POSTGRES_DB: ucrip_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucrip -d ucrip_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ucrip_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ucrip_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://ucrip:ucrip_secret_2024@postgres:5432/ucrip_db
      - DATABASE_URL_SYNC=postgresql://ucrip:ucrip_secret_2024@postgres:5432/ucrip_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=ucrip-super-secret-key-change-in-production-2024
      - JWT_SECRET_KEY=ucrip-jwt-secret-key-change-in-production-2024
      - JWT_REFRESH_SECRET_KEY=ucrip-jwt-refresh-secret-key-change-in-production-2024
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80","http://localhost"]
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ucrip_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ucrip_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  uploads_data:
