[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",  # line length handled separately, keep readable
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"app/**/__init__.py" = ["F401", "F403"]
"app/schemas/auth.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]